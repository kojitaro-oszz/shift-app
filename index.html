<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シフト管理</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 12px; background: #f5f5f7; }
  h1 { font-size: 18px; text-align: center; margin: 4px 0 12px; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .nav button { font-size: 18px; padding: 8px 16px; border: none; border-radius: 8px; background: #fff; }
  #title { font-size: 17px; font-weight: bold; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 12px; color: #666; padding: 4px 0; }
  .day { background: #fff; border-radius: 8px; min-height: 58px; padding: 3px; font-size: 13px; border: 2px solid transparent; overflow: hidden; }
  .day.empty { background: transparent; }
  .day.today { border-color: #0a84ff; }
  .day.selected { background: #dbeafe; }
  .sun { color: #d33; }
  .sat { color: #0a60d3; }
  .tag { display: block; margin-top: 2px; font-size: 10px; color: #fff; border-radius: 4px; padding: 1px 2px; text-align: center; white-space: nowrap; overflow: hidden; }
  .memo-mark { font-size: 10px; margin-left: 2px; }
  .todo-dot { display: inline-block; width: 7px; height: 7px; background: #0a84ff; border-radius: 50%; margin-left: 3px; vertical-align: middle; }
  .panel { margin-top: 12px; padding: 12px; background: #fff; border-radius: 8px; }
  .panel h2 { font-size: 15px; margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: none; color: #fff; padding: 8px 12px; border-radius: 16px; font-size: 14px; }
  .chip.off { background: #999 !important; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .row input[type=text] { flex: 1; min-width: 0; font-size: 16px; padding: 6px; border: 1px solid #ccc; border-radius: 6px; }
  .row input[type=time] { font-size: 14px; }
  .row input[type=color] { width: 36px; height: 32px; border: none; padding: 0; background: none; }
  .del { border: none; background: #fee; color: #c00; border-radius: 6px; padding: 6px 10px; }
  .add { border: none; background: #0a84ff; color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 14px; margin-top: 4px; }
  .add.sub { background: #e5e7eb; color: #111; }
  .small { font-size: 12px; color: #666; margin: 4px 0 0; }
  #memoText { width: 100%; box-sizing: border-box; min-height: 90px; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; resize: vertical; }
  #memoText:disabled { background: #f0f0f0; }
  .todo-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  .todo-item input[type=checkbox] { width: 22px; height: 22px; flex-shrink: 0; }
  .todo-item span { flex: 1; font-size: 15px; word-break: break-all; }
  .todo-item.done span { text-decoration: line-through; color: #999; }
  .todo-empty { color: #999; font-size: 14px; padding: 6px 0; }
  .todo-form { display: flex; gap: 6px; margin-top: 8px; }
  .todo-form input { flex: 1; min-width: 0; font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  .todo-form button { margin-top: 0; }
  .link-btn { border: none; background: none; color: #0a84ff; font-size: 13px; padding: 0; margin-left: 8px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns .add { margin-top: 0; }
  .sep { border: none; border-top: 1px solid #eee; margin: 12px 0; }
  #backupText { width: 100%; box-sizing: border-box; min-height: 70px; font-size: 14px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; margin-top: 8px; }
  #backupMsg { font-size: 13px; margin: 8px 0 0; min-height: 18px; }
  #backupMsg.ok { color: #0a7d3b; }
  #backupMsg.ng { color: #c00; }
</style>
</head>
<body>
<h1>シフト管理アプリ</h1>
<div class="nav">
  <button id="prev">◀</button>
  <span id="title"></span>
  <button id="next">▶</button>
</div>
<div class="grid" id="grid"></div>

<div class="panel" id="assign">
  <h2 id="assignTitle">日付をタップしてください</h2>
  <div class="chips" id="chips"></div>
</div>

<div class="panel">
  <h2 id="memoTitle">メモ</h2>
  <textarea id="memoText" placeholder="日付をタップするとメモを書けます" disabled></textarea>
  <p class="small">入力すると自動保存されます</p>
</div>

<div class="panel">
  <h2><span id="todoTitle">ToDo(日付なし)</span><button class="link-btn" id="todoUnselect" style="display:none">日付の選択を外す</button></h2>
  <div id="todoList"></div>
  <div class="todo-form">
    <input type="text" id="todoInput" placeholder="やることを入力">
    <button class="add" id="todoAdd">追加</button>
  </div>
</div>

<div class="panel">
  <h2>シフトの種類</h2>
  <div id="patterns"></div>
  <button class="add" id="addPattern">+ 種類を追加</button>
  <p class="small">名前・色・時間を変更すると自動保存されます</p>
</div>

<div class="panel">
  <h2>バックアップ</h2>
  <div class="btns">
    <button class="add" id="bkFile">ファイルで保存</button>
    <button class="add sub" id="bkCopy">テキストをコピー</button>
  </div>
  <hr class="sep">
  <div class="btns">
    <button class="add" id="rsFileBtn">ファイルから復元</button>
    <button class="add sub" id="rsTextBtn">テキストから復元</button>
  </div>
  <input type="file" id="rsFile" accept=".json,application/json,text/plain" style="display:none">
  <textarea id="backupText" placeholder="コピーしたテキストを貼り付けてから「テキストから復元」を押します"></textarea>
  <p id="backupMsg"></p>
  <p class="small">復元すると、今のデータは上書きされます。復元の前に、一度バックアップを取っておくと安心です。</p>
</div>

<script>
var current = new Date();
current.setDate(1);
var selected = null;
var dows = ['日','月','火','水','木','金','土'];

var patterns = [];
var shifts = {};
var memos = {};
var todos = [];

function load() {
  try {
    var p = localStorage.getItem('shift_patterns');
    var s = localStorage.getItem('shift_assign');
    var m = localStorage.getItem('shift_memos');
    var t = localStorage.getItem('shift_todos');
    if (p) patterns = JSON.parse(p);
    if (s) shifts = JSON.parse(s);
    if (m) memos = JSON.parse(m);
    if (t) todos = JSON.parse(t);
  } catch (e) {}
  if (!patterns.length) {
    patterns = [
      { id: 'p1', name: '早番', color: '#f59e0b', start: '08:00', end: '16:00' },
      { id: 'p2', name: '遅番', color: '#6366f1', start: '14:00', end: '22:00' },
      { id: 'p3', name: '休み', color: '#10b981', start: '', end: '' }
    ];
  }
}
function save() {
  try {
    localStorage.setItem('shift_patterns', JSON.stringify(patterns));
    localStorage.setItem('shift_assign', JSON.stringify(shifts));
    localStorage.setItem('shift_memos', JSON.stringify(memos));
    localStorage.setItem('shift_todos', JSON.stringify(todos));
  } catch (e) {}
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function findPattern(id) {
  for (var i = 0; i < patterns.length; i++) if (patterns[i].id === id) return patterns[i];
  return null;
}
function hasOpenTodo(key) {
  for (var i = 0; i < todos.length; i++) {
    if (todos[i].date === key && !todos[i].done) return true;
  }
  return false;
}

function renderCalendar() {
  var y = current.getFullYear();
  var m = current.getMonth();
  document.getElementById('title').textContent = y + '年' + (m + 1) + '月';
  var grid = document.getElementById('grid');
  grid.innerHTML = '';

  for (var i = 0; i < 7; i++) {
    var d = document.createElement('div');
    d.className = 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
    d.textContent = dows[i];
    grid.appendChild(d);
  }

  var firstDow = new Date(y, m, 1).getDay();
  var lastDate = new Date(y, m + 1, 0).getDate();
  var now = new Date();
  var todayKey = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());

  for (var e = 0; e < firstDow; e++) {
    var empty = document.createElement('div');
    empty.className = 'day empty';
    grid.appendChild(empty);
  }

  for (var day = 1; day <= lastDate; day++) {
    var key = y + '-' + pad(m + 1) + '-' + pad(day);
    var cell = document.createElement('div');
    var dow = new Date(y, m, day).getDay();
    var cls = 'day';
    if (dow === 0) cls += ' sun';
    if (dow === 6) cls += ' sat';
    if (key === todayKey) cls += ' today';
    if (key === selected) cls += ' selected';
    cell.className = cls;
    cell.appendChild(document.createTextNode(day));

    if (memos[key]) {
      var mark = document.createElement('span');
      mark.className = 'memo-mark';
      mark.textContent = '📝';
      cell.appendChild(mark);
    }
    if (hasOpenTodo(key)) {
      var dot = document.createElement('span');
      dot.className = 'todo-dot';
      cell.appendChild(dot);
    }

    var pat = shifts[key] ? findPattern(shifts[key]) : null;
    if (pat) {
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.style.background = pat.color;
      tag.textContent = pat.name;
      cell.appendChild(tag);
    }

    cell.setAttribute('data-key', key);
    cell.onclick = function () {
      selected = this.getAttribute('data-key');
      renderCalendar();
      renderAssign();
      renderMemo();
      renderTodos();
    };
    grid.appendChild(cell);
  }
}

function renderAssign() {
  var title = document.getElementById('assignTitle');
  var chips = document.getElementById('chips');
  chips.innerHTML = '';
  if (!selected) { title.textContent = '日付をタップしてください'; return; }
  title.textContent = selected + ' のシフト';

  patterns.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'chip' + (shifts[selected] === p.id ? '' : ' off');
    b.style.background = p.color;
    var label = p.name + (p.start ? ' ' + p.start + '-' + p.end : '');
    b.textContent = label;
    b.onclick = function () {
      if (shifts[selected] === p.id) delete shifts[selected];
      else shifts[selected] = p.id;
      save();
      renderCalendar();
      renderAssign();
    };
    chips.appendChild(b);
  });

  var clear = document.createElement('button');
  clear.className = 'chip';
  clear.style.background = '#666';
  clear.textContent = 'クリア';
  clear.onclick = function () {
    delete shifts[selected];
    save();
    renderCalendar();
    renderAssign();
  };
  chips.appendChild(clear);
}

function renderMemo() {
  var title = document.getElementById('memoTitle');
  var ta = document.getElementById('memoText');
  if (!selected) {
    title.textContent = 'メモ';
    ta.value = '';
    ta.disabled = true;
    ta.placeholder = '日付をタップするとメモを書けます';
    return;
  }
  title.textContent = selected + ' のメモ';
  ta.disabled = false;
  ta.placeholder = 'ここにメモを入力';
  ta.value = memos[selected] || '';
}

function renderTodos() {
  var key = selected || '';
  document.getElementById('todoTitle').textContent = selected ? 'ToDo(' + selected + ')' : 'ToDo(日付なし)';
  document.getElementById('todoUnselect').style.display = selected ? 'inline' : 'none';
  var list = document.getElementById('todoList');
  list.innerHTML = '';
  var count = 0;
  todos.forEach(function (t) {
    if (t.date !== key) return;
    count++;
    var item = document.createElement('div');
    item.className = 'todo-item' + (t.done ? ' done' : '');

    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = t.done;
    cb.onchange = function () {
      t.done = this.checked;
      save();
      renderCalendar();
      renderTodos();
    };

    var label = document.createElement('span');
    label.textContent = t.text;

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '削除';
    del.onclick = function () {
      todos = todos.filter(function (x) { return x.id !== t.id; });
      save();
      renderCalendar();
      renderTodos();
    };

    item.appendChild(cb);
    item.appendChild(label);
    item.appendChild(del);
    list.appendChild(item);
  });
  if (!count) {
    var empty = document.createElement('div');
    empty.className = 'todo-empty';
    empty.textContent = 'ToDoはありません';
    list.appendChild(empty);
  }
}

function renderPatterns() {
  var box = document.getElementById('patterns');
  box.innerHTML = '';
  patterns.forEach(function (p, idx) {
    var row = document.createElement('div');
    row.className = 'row';

    var color = document.createElement('input');
    color.type = 'color';
    color.value = p.color;
    color.onchange = function () { p.color = this.value; save(); renderAll(); };

    var name = document.createElement('input');
    name.type = 'text';
    name.value = p.name;
    name.onchange = function () { p.name = this.value || '名称なし'; save(); renderCalendar(); renderAssign(); };

    var st = document.createElement('input');
    st.type = 'time';
    st.value = p.start;
    st.onchange = function () { p.start = this.value; save(); renderAssign(); };

    var en = document.createElement('input');
    en.type = 'time';
    en.value = p.end;
    en.onchange = function () { p.end = this.value; save(); renderAssign(); };

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '削除';
    del.onclick = function () {
      if (!confirm('「' + p.name + '」を削除しますか?')) return;
      patterns.splice(idx, 1);
      for (var k in shifts) { if (shifts[k] === p.id) delete shifts[k]; }
      save();
      renderAll();
    };

    row.appendChild(color);
    row.appendChild(name);
    row.appendChild(st);
    row.appendChild(en);
    row.appendChild(del);
    box.appendChild(row);
  });
}

function renderAll() {
  renderCalendar();
  renderAssign();
  renderMemo();
  renderTodos();
  renderPatterns();
}

/* ---------- バックアップ ---------- */
function showMsg(text, ok) {
  var el = document.getElementById('backupMsg');
  el.textContent = text;
  el.className = ok ? 'ok' : 'ng';
}

function buildBackup() {
  return JSON.stringify({
    app: 'shift-app',
    version: 1,
    exportedAt: new Date().toISOString(),
    patterns: patterns,
    shifts: shifts,
    memos: memos,
    todos: todos
  });
}

function backupFileName() {
  var n = new Date();
  return 'shift-backup-' + n.getFullYear() + pad(n.getMonth() + 1) + pad(n.getDate()) + '.json';
}

function isPlainObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

function restoreFrom(text) {
  var data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    showMsg('データを読み取れませんでした。バックアップのテキストを正しく貼り付けてください。', false);
    return;
  }
  if (!data || data.app !== 'shift-app' || !Array.isArray(data.patterns) || !isPlainObject(data.shifts) || !isPlainObject(data.memos) || !Array.isArray(data.todos)) {
    showMsg('このアプリのバックアップではありません。', false);
    return;
  }
  var msg = 'バックアップを復元します。今のデータは上書きされます。\n\n' +
    'シフトの種類:' + data.patterns.length + '件\n' +
    'シフト:' + Object.keys(data.shifts).length + '日分\n' +
    'メモ:' + Object.keys(data.memos).length + '件\n' +
    'ToDo:' + data.todos.length + '件\n\nよろしいですか?';
  if (!confirm(msg)) {
    showMsg('復元をキャンセルしました。', false);
    return;
  }
  patterns = data.patterns;
  shifts = data.shifts;
  memos = data.memos;
  todos = data.todos;
  selected = null;
  save();
  renderAll();
  document.getElementById('backupText').value = '';
  showMsg('復元しました。', true);
}

document.getElementById('bkFile').onclick = function () {
  var json = buildBackup();
  var name = backupFileName();
  try {
    var file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(function () {
        showMsg('共有メニューから保存先を選んでください。', true);
      }).catch(function () {
        showMsg('保存がキャンセルされました。', false);
      });
      return;
    }
  } catch (e) {}
  try {
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    showMsg('ダウンロードしました。「ファイル」アプリを確認してください。', true);
  } catch (e) {
    showMsg('ファイル保存に失敗しました。「テキストをコピー」を使ってください。', false);
  }
};

document.getElementById('bkCopy').onclick = function () {
  var json = buildBackup();
  var ta = document.getElementById('backupText');
  ta.value = json;
  function fallback() {
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, json.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (ok) showMsg('コピーしました。メモアプリなどに貼り付けて保管してください。', true);
    else showMsg('自動コピーできませんでした。下の欄を長押しして「すべてを選択」→「コピー」してください。', false);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(function () {
      showMsg('コピーしました。メモアプリなどに貼り付けて保管してください。', true);
    }).catch(fallback);
  } else {
    fallback();
  }
};

document.getElementById('rsFileBtn').onclick = function () {
  document.getElementById('rsFile').click();
};
document.getElementById('rsFile').onchange = function () {
  var f = this.files && this.files[0];
  var input = this;
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    restoreFrom(String(reader.result));
    input.value = '';
  };
  reader.onerror = function () {
    showMsg('ファイルを読み込めませんでした。', false);
    input.value = '';
  };
  reader.readAsText(f);
};
document.getElementById('rsTextBtn').onclick = function () {
  var text = document.getElementById('backupText').value.trim();
  if (!text) {
    showMsg('先に、バックアップのテキストを下の欄に貼り付けてください。', false);
    return;
  }
  restoreFrom(text);
};
/* ---------- /バックアップ ---------- */

document.getElementById('memoText').oninput = function () {
  if (!selected) return;
  var v = this.value;
  if (v.trim()) memos[selected] = v;
  else delete memos[selected];
  save();
  renderCalendar();
};

function addTodo() {
  var input = document.getElementById('todoInput');
  var text = input.value.trim();
  if (!text) return;
  todos.push({ id: 't' + Date.now(), text: text, done: false, date: selected || '' });
  input.value = '';
  save();
  renderCalendar();
  renderTodos();
}
document.getElementById('todoAdd').onclick = addTodo;
document.getElementById('todoInput').onkeydown = function (e) {
  if (e.key === 'Enter') addTodo();
};
document.getElementById('todoUnselect').onclick = function () {
  selected = null;
  renderCalendar();
  renderAssign();
  renderMemo();
  renderTodos();
};

document.getElementById('prev').onclick = function () {
  current.setMonth(current.getMonth() - 1);
  renderCalendar();
};
document.getElementById('next').onclick = function () {
  current.setMonth(current.getMonth() + 1);
  renderCalendar();
};
document.getElementById('addPattern').onclick = function () {
  patterns.push({ id: 'p' + Date.now(), name: '新しいシフト', color: '#ec4899', start: '09:00', end: '17:00' });
  save();
  renderAll();
};

load();
renderAll();
</script>
</body>
</html>
